[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Local-first opportunity ranking engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oe-rescore = "opportunity_engine.scoring:main"

[tool.setuptools.packages.find]
include = ["opportunity_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
